services:
  # 1. Gateway Zero-Trust & Motor Jurídico (FastAPI)
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: aigovern-gateway
    ports:
      - "8000:8000"
    restart: always
    environment:
      - APP_NAME=AI GOVERN
      - OWNER_NAME=Barbara Piccolo
      - GROQ_API_KEY=${GROQ_API_KEY:-demo_key_valida}
      - VECTOR_DB_HOST=qdrant
      - VECTOR_DB_PORT=6333
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-secret_aigovern_master_key_2026}
    volumes:
      - ./storage/contracts:/app/storage/contracts
      - ./storage/forensic:/app/storage/forensic
    depends_on:
      - qdrant
    networks:
      - aigovern_net

  # 2. Frontend Taskade-Style (Next.js Dashboard)
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: aigovern-dashboard
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      - gateway
    networks:
      - aigovern_net

  # 3. Base de Datos Vectorial Privada (Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: aigovern-qdrant
    ports:
      - "6333:6333"
    restart: always
    volumes:
      - ./storage/qdrant_storage:/qdrant/storage
    networks:
      - aigovern_net

networks:
  aigovern_net:
    driver: bridge
